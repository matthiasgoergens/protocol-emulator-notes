# Tiny Tapeout project information: the combined chip (prototypes/chip-top). The earlier
# sequencer-only harness is variants/seqv2/ (harden with TT_VARIANT=seqv2).
# Layout from TinyTapeout/ttihp-verilog-template (Apache-2.0), cmos5l branch, yaml_version 6.
project:
  title:        "Programmable protocol chip, combined prototype v0"
  author:       "Matthias Goergens"
  discord:      ""
  description:  "Four-thread deadline sequencer, PE array, pin stage, streamer, sampler, edge sampler, CRC unit, matcher and pin NCO behind a 4-bit host link; generated from Hardcaml"
  language:     "Verilog"
  clock_hz:     60000000

  tiles: "6x4"

  top_module:  "tt_um_chip_top"

  # chip_tt.v is generated (tt/scripts/regen_chip.sh); the SRAM macros come in through MACROS in
  # src/config.json, whose "nl" entries name their port-only blackboxes.
  source_files:
    - "chip_project.v"
    - "chip_tt.v"

pinout:
  # Inputs
  ui[0]: "gen_in0 (any protocol input)"
  ui[1]: "gen_in1 (any protocol input)"
  ui[2]: "gen_in2 (any protocol input)"
  ui[3]: "gen_in3 (any protocol input)"
  ui[4]: "gen_in4 (any protocol input)"
  ui[5]: "gen_in5 (any protocol input)"
  ui[6]: "gen_in6 (any protocol input)"
  ui[7]: "gen_in7 (any protocol input)"

  # Outputs
  uo[0]: "gen_out0 (push-pull, source-selected)"
  uo[1]: "gen_out1 (push-pull, source-selected)"
  uo[2]: "gen_out2 (push-pull, source-selected)"
  uo[3]: "gen_out3 (push-pull, source-selected)"
  uo[4]: "gen_out4 (push-pull, source-selected)"
  uo[5]: "gen_out5 (push-pull, source-selected)"
  uo[6]: "gen_out6 (push-pull, source-selected)"
  uo[7]: "gen_out7 (push-pull, source-selected)"

  # Bidirectional pins
  uio[0]: "host_d0"
  uio[1]: "host_d1"
  uio[2]: "host_d2"
  uio[3]: "host_d3"
  uio[4]: "host_strobe"
  uio[5]: "host_read"
  uio[6]: "gen_io14 (open drain, source-selected)"
  uio[7]: "gen_io15 (open drain, source-selected)"

# Do not change!
yaml_version: 6
